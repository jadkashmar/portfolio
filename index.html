    <!-- Structured data: tells Google this page is a specific person, and links the
         canonical profiles (sameAs) so a search for "Jad Kashmar" can surface a
         knowledge panel / rich result instead of a plain blue link. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jad Kashmar",
        "url": "https://jadkashmar.dev/",
        "image": "https://jadkashmar.dev/og-image.png",
        "jobTitle": "Computer Engineer",
        "description": "Full-stack web developer and Computer Engineering student at Lebanese American University, building data-driven React applications and designing digital hardware systems.",
        "email": "mailto:jad.kashmar@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Byblos",
          "addressCountry": "LB"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Lebanese American University"
        },
        "sameAs": ["https://github.com/jadkashmar", "https://www.linkedin.com/in/jad-kashmar-1980a13b0"]
      }
    </script>
