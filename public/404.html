<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2b2b2b" />
    <title>Page not found — Jad Kashmar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #2b2b2b;
        --ink: #ffffff;
        --muted: #cccccc;
        --line: #3a3a3a;
        --accent: #dc143c;
        --accent-hover: #bb0028;
        --accent-ink: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 1.5rem;
        text-align: center;
      }
      .mark {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 0.9rem;
        letter-spacing: 0.12em;
        font-weight: 500;
        margin-bottom: 2.5rem;
      }
      .mark span {
        color: var(--accent);
      }
      h1 {
        font-size: clamp(4rem, 14vw, 8rem);
        line-height: 1;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin: 0;
      }
      p {
        margin: 1rem 0 2.25rem;
        color: var(--muted);
        font-size: 1.05rem;
        max-width: 32ch;
      }
      a.home {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--accent);
        color: var(--accent-ink);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        padding: 0.85rem 1.75rem;
        border-radius: 2px;
        transition: background-color 200ms ease;
      }
      a.home:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="mark">JK<span>/</span></div>
    <h1>404</h1>
    <p>This page doesn't exist. It may have moved, or the link is wrong.</p>
    <a class="home" href="/">Back to home</a>
  </body>
</html>
